# Rebuilds the site on the dates its published figures change.
#
# The site is statically built, but two things are chosen by comparing the build
# clock against fixed dates: the lighting rate tier in src/data/pricing.ts, and
# the seasonal opening hours in src/data/business.ts. Nothing rebuilds a static
# site on its own, so without this the site would keep advertising $6.50/ft into
# October and Mon-Sat 8-8 into February.
#
# This pushes an empty commit, which triggers the existing Vercel Git
# integration. That deliberately avoids needing a Vercel deploy hook and the
# secret that goes with it - no external credentials, nothing to rotate, nothing
# to leak. The cost is a handful of no-op commits a year, which is why it fires
# only on the dates that actually matter rather than daily.
#
# Dates, and what changes on each (keep in step with the two data files):
#   1 Oct  - rate 6.50 -> 7.25
#   1 Nov  - rate 7.25 -> 7.95
#   15 Jan - hours revert to Mon-Fri 8-6
#
# Each fires on the boundary and again the following day. GitHub's scheduled
# runs are best-effort and can be delayed or dropped under load, so the second
# run is the safety net. If the first worked, the second is a harmless no-op
# deploy.
#
# 07:05 UTC is 00:05 Pacific Daylight Time; 08:05 UTC in January is 00:05 PST.
# Both data files define their boundaries at Pacific midnight, so the run lands
# minutes after the switch rather than hours either side of it.
#
# KNOWN RISK: GitHub disables scheduled workflows in repositories with no
# activity for 60 days. From 6 August to 1 October is 56 days. If the repo goes
# quiet through September, check the Actions tab before the 1st - or just run it
# manually, which is what workflow_dispatch is for.
#
# After each boundary, confirm the site actually changed. The rate is on
# /christmas-light-installation-vancouver-wa; the hours are in the footer.

name: Scheduled rebuild

on:
  schedule:
    - cron: '5 7 1,2 10 *'   # 1-2 October  - rate moves to $7.25
    - cron: '5 7 1,2 11 *'   # 1-2 November - rate moves to $7.95
    - cron: '5 8 15,16 1 *'  # 15-16 January - seasonal hours expire
  workflow_dispatch:

# Needed to push. The default token is read-only in repositories configured that
# way, and a permission error here looks exactly like a missed rebuild.
permissions:
  contents: write

jobs:
  rebuild:
    name: Trigger production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Push an empty commit to trigger a deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Rebuild: refresh date-dependent rate and hours

          Automated no-op commit. The published lighting rate and seasonal opening
          hours are resolved at build time, so a deploy is what actually applies
          them. Triggered by .github/workflows/scheduled-rebuild.yml."
          git push
